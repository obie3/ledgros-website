name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Required for OIDC — the job exchanges a GitHub token for AWS credentials.
permissions:
  id-token: write
  contents: read

concurrency:
  
  group: deploy-production
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck & build
        run: yarn build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1) Long-cache immutable hashed assets.
      - name: Sync hashed assets
        run: |
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      # 2) Everything else (index.html, favicons) — short cache so releases
      #    show up immediately. index.html must never be cached long.
      - name: Sync entry files
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public,max-age=60,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/"
